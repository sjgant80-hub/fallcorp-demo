name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the engine against its sealed exams
        run: node --test kernels.test.mjs

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate kernels.mjs \
            --timeout 120000 --cap 500 \
            --baseline witness.baseline.json \
            --test node --test kernels.test.mjs

      - name: the shipped page still carries the gated kernels
        run: |
          cp index.html /tmp/shipped.html
          node scripts/build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from kernels.mjs — run scripts/build-page.mjs and commit."
            exit 1
          }
